<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="52" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="30" font-weight="700" fill="#111111">项目委员会组织架构</text>

  <!-- 总决策 -->
  <rect x="430" y="88" width="740" height="112" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="800" y="121" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#555555">总决策</text>
  <text x="620" y="166" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#111111">加速进化｜史克克</text>
  <text x="980" y="166" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="24" font-weight="700" fill="#111111">北京地铁｜赵总</text>

  <!-- 总决策到双方项目经理 -->
  <line x1="800" y1="200" x2="800" y2="236" stroke="#555555" stroke-width="2"/>
  <line x1="420" y1="236" x2="1180" y2="236" stroke="#555555" stroke-width="2"/>
  <line x1="420" y1="236" x2="420" y2="272" stroke="#555555" stroke-width="2"/>
  <line x1="1180" y1="236" x2="1180" y2="272" stroke="#555555" stroke-width="2"/>

  <!-- 双方项目经理 -->
  <rect x="220" y="272" width="400" height="104" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="420" y="307" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#555555">加速进化侧</text>
  <text x="420" y="348" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#111111">项目经理｜徐倩凇</text>

  <rect x="980" y="272" width="400" height="104" fill="#ffffff" stroke="#444444" stroke-width="2"/>
  <text x="1180" y="307" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="16" fill="#555555">北京地铁侧</text>
  <text x="1180" y="348" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="700" fill="#111111">项目经理｜吴部长</text>

  <!-- 加速进化侧职责 -->
  <line x1="420" y1="376" x2="420" y2="430" stroke="#555555" stroke-width="2"/>
  <line x1="290" y1="430" x2="550" y2="430" stroke="#555555" stroke-width="2"/>
  <line x1="290" y1="430" x2="290" y2="466" stroke="#555555" stroke-width="2"/>
  <line x1="550" y1="430" x2="550" y2="466" stroke="#555555" stroke-width="2"/>

  <rect x="180" y="466" width="220" height="108" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="290" y="528" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#111111">产品经理</text>

  <rect x="440" y="466" width="220" height="108" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="550" y="528" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="700" fill="#111111">开发负责人</text>

  <!-- 技术架构设计顾问仅连接开发负责人 -->
  <line x1="550" y1="574" x2="550" y2="636" stroke="#555555" stroke-width="2"/>
  <rect x="440" y="636" width="220" height="108" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="550" y="684" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111111">技术架构</text>
  <text x="550" y="714" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111111">设计顾问</text>

  <!-- 北京地铁侧职责 -->
  <line x1="1180" y1="376" x2="1180" y2="430" stroke="#555555" stroke-width="2"/>
  <line x1="920" y1="430" x2="1440" y2="430" stroke="#555555" stroke-width="2"/>
  <line x1="920" y1="430" x2="920" y2="466" stroke="#555555" stroke-width="2"/>
  <line x1="1180" y1="430" x2="1180" y2="466" stroke="#555555" stroke-width="2"/>
  <line x1="1440" y1="430" x2="1440" y2="466" stroke="#555555" stroke-width="2"/>

  <rect x="810" y="466" width="220" height="108" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="920" y="513" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111111">集成方案</text>
  <text x="920" y="543" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111111">负责人</text>

  <rect x="1070" y="466" width="220" height="108" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="1180" y="528" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111111">集成开发负责人</text>

  <rect x="1330" y="466" width="220" height="108" fill="#ffffff" stroke="#666666" stroke-width="2"/>
  <text x="1440" y="513" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111111">测试与验收</text>
  <text x="1440" y="543" text-anchor="middle" font-family="Noto Sans SC, Microsoft YaHei, sans-serif" font-size="17" font-weight="700" fill="#111111">负责人</text>
</svg>
