<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <rect x="0" y="0" width="1600" height="900" fill="#ffffff"/>

  <text x="800" y="62" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="30" font-weight="700" fill="#1f2933">项目委员会组织架构</text>

  <!-- 总决策 -->
  <rect x="570" y="102" width="460" height="116" rx="2" fill="#ffffff" stroke="#3f4850" stroke-width="2"/>
