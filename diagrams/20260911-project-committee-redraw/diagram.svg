  <text x="400" y="385" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1f2933">徐倩凇</text>
  <rect x="980" y="307" width="440" height="110" rx="2" fill="#ffffff" stroke="#3f4850" stroke-width="2"/>
  <text x="1200" y="345" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="16" font-weight="400" fill="#68727c">项目经理</text>
  <text x="1200" y="385" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="26" font-weight="700" fill="#1f2933">吴雁军</text>

