  <text x="800" y="184" text-anchor="middle" font-family="Noto Sans SC, sans-serif" font-size="27" font-weight="700" fill="#1f2933">史克克 / 赵总</text>

  <!-- 总决策至双方项目经理 -->
  <polyline points="800,218 800,260 400,260 400,307" fill="none" stroke="#4b5560" stroke-width="2"/>
  <polyline points="800,260 1200,260 1200,307" fill="none" stroke="#4b5560" stroke-width="2"/>

