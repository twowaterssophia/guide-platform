services:
  postgres:
    image: postgres:16-alpine
    container_name: guide-postgres
    environment:
      POSTGRES_USER: guide
      POSTGRES_PASSWORD: guide
      POSTGRES_DB: guide
    ports:
      - "5432:5432"
    volumes:
      - guide-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guide -d guide"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  guide-postgres-data:
